# Fetches the daily menu JSON published by this repo's GitHub Pages.
#
# Include from configuration.yaml, e.g.:
#   sensor: !include homeassistant/rest_sensor.yaml
# or paste the list item(s) directly under your existing `sensor:` key.

- platform: rest
  name: Five Moods Menu
  resource: https://magicmatt007.github.io/5moods/five-moods-zug.json
  method: GET
  scan_interval: 3600 # data itself only changes once a day; this just controls polling cost
  value_template: >-
    {{ (value_json.days.get(now().strftime('%Y-%m-%d'), [])) | length }} dishes
  json_attributes:
    - restaurant
    - updated_utc
    - days
