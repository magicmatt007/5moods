# Fetches the daily menu JSON published by this repo's GitHub Pages.
#
# Uses the modern top-level `rest:` integration syntax. Merge this list
# item into your existing `rest:` key, e.g.:
#   rest: !include homeassistant/rest_sensor.yaml
# (as a single-item list under `rest:`, or copy the `- resource: ...` block
# into your existing `rest:` list).

rest:
  - resource: https://magicmatt007.github.io/5moods/five-moods-zug.json
    scan_interval: 3600 # data itself only changes once a day; this just controls polling cost
    sensor:
      - name: "Five Moods Menu"
        unique_id: five_moods_menu
        value_template: >-
          {{ (value_json.days.get(now().strftime('%Y-%m-%d'), [])) | length }} dishes
        json_attributes:
          - restaurant
          - updated_utc
          - days
          - by_weekday
