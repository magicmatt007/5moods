# Derives "today's dishes" from sensor.five_moods_menu (see rest_sensor.yaml)
# so cards don't need to repeat the date-lookup logic.
#
# Merge this list item into your existing `template:` section, e.g.:
#   template: !include homeassistant/template_sensor.yaml
# (as a single-item list under `template:`).

template:
  - sensor:
      unique_id: five_moods_today
      name: "Five Moods Today"
      state: >-
        {{ state_attr('sensor.five_moods_menu', 'days').get(now().strftime('%Y-%m-%d'), []) | length }}
      attributes:
        dishes: >-
          {{ state_attr('sensor.five_moods_menu', 'days').get(now().strftime('%Y-%m-%d'), []) }}
